name: QA CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  REPORT_ROOT: site

jobs:
  test-and-deploy:
    name: Playwright Tests & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://www.gov.uk/calculate-your-holiday-entitlement' }}
      TIMEOUT: ${{ secrets.TIMEOUT || '30000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Playwright_test/package-lock.json'

      - name: Install dependencies
        working-directory: ./Playwright_test
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./Playwright_test
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright_tests
        working-directory: ./Playwright_test
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "▶ STARTING PLAYWRIGHT TESTS."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "BASE_URL: ${BASE_URL}"
          echo ""

          if npx playwright test --reporter=list --reporter=ortoni-report --reporter=html; then
            echo "✅ PLAYWRIGHT TESTS PASSED."
            echo "PLAYWRIGHT_STATUS=PASSED" >> $GITHUB_ENV
            echo "playwright_status=PASSED" >> $GITHUB_OUTPUT
          else
            echo "❌ PLAYWRIGHT TESTS FAILED."
            echo "PLAYWRIGHT_STATUS=FAILED" >> $GITHUB_ENV
            echo "playwright_status=FAILED" >> $GITHUB_OUTPUT
          fi

          if [ -f "ortoni-report/ortoni-report.html" ]; then
            echo "✅ Ortoni report generated."
          else
            echo "⚠️ Ortoni report not found."
          fi
        continue-on-error: true

      - name: Prepare site structure
        working-directory: ./Playwright_test
        run: |
          echo "📦 Preparing site directory..."
          mkdir -p ../site
          echo "✅ Site directory created."

      - name: Copy Ortoni report as main index
        working-directory: ./Playwright_test
        run: |
          echo "📄 Setting up Ortoni report..."
          if [ -f "ortoni-report/ortoni-report.html" ]; then
            cp ortoni-report/ortoni-report.html ../site/index.html
            echo "✅ Ortoni report copied to site/index.html"
          else
            echo "⚠️ No Ortoni report found."
          fi

      - name: Generate fallback if needed
        run: |
          if [ ! -f "site/index.html" ]; then
            echo "⚠️ Generating fallback HTML..."
            mkdir -p site
            cat > site/index.html << 'EOF'
