name: QA CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: UTC

jobs:
  test-and-deploy:
    name: Playwright Tests & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://www.gov.uk/calculate-your-holiday-entitlement' }}
      TIMEOUT: ${{ secrets.TIMEOUT || '30000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Playwright_test/package-lock.json

      - name: Install dependencies
        working-directory: ./Playwright_test
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./Playwright_test
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright_tests
        working-directory: ./Playwright_test
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "▶ STARTING PLAYWRIGHT TESTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if npx playwright test --reporter=list --reporter=ortoni-report --reporter=html; then
            echo "✅ PLAYWRIGHT TESTS PASSED"
          else
            echo "❌ PLAYWRIGHT TESTS FAILED"
          fi

          if [ -f "ortoni-report/ortoni-report.html" ]; then
            echo "✅ Ortoni report generated"
          else
            echo "❌ Ortoni report not found"
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          echo "📦 Preparing Pages artifact..."

          mkdir -p site

          # Fix lastRunDate to include UTC timezone indicator
          # Ortoni-report formats dates without timezone info, which is confusing
          REPORT_FILE="Playwright_test/ortoni-report/ortoni-report.html"
          if [ -f "$REPORT_FILE" ]; then
            sed -i 's/"lastRunDate":"\(May [0-9]*, [0-9]*, [0-9:]* [AP]M\)"/"lastRunDate":"\1 UTC"/g' "$REPORT_FILE"
          fi

          cp Playwright_test/ortoni-report/ortoni-report.html site/index.html

          echo "✅ Report copied"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
